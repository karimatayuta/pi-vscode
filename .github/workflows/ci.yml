name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun ci

      - name: Check formatting, types, and tests
        run: bun run check

      - name: Build production bundles
        run: bun run build:production

  integration-package:
    name: Extension Host and VSIX
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PI_AGENT_TEST_VSCODE_VERSION: 1.106.3

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun ci

      - name: Audit dependencies
        run: bun run audit:dependencies

      - name: Run Extension Host tests
        run: xvfb-run -a bun run test:integration

      - name: Package and verify VSIX
        run: bun run package:ci

      - name: Test the unpacked VSIX in Extension Host
        run: xvfb-run -a bun run test:package -- pi-agent-ci.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pi-agent-vsix
          path: pi-agent-ci.vsix
          if-no-files-found: error
          retention-days: 14

  current-vscode-compatibility:
    name: Current VS Code compatibility
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PI_AGENT_TEST_VSCODE_VERSION: 1.135.0

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun ci

      - name: Run Extension Host tests
        run: xvfb-run -a bun run test:integration
